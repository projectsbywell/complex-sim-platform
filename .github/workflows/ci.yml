name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install bandit flake8 black mypy pytest pytest-cov
      - run: black --check .
      - run: flake8 simulation-core/ backend/ security/ pipeline/
      - run: bandit -r simulation-core/ backend/ security/ -ll
      - run: mypy simulation-core/ backend/ --ignore-missing-imports
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r simulation-core/requirements.txt -r backend/requirements.txt -r tests/requirements-test.txt
      - run: python -m pytest -q --cov=simcore --cov=app --cov-report=term-missing
      - run: python tests/test_load.py
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit safety
      - run: pip-audit
      - run: safety check -r backend/requirements.txt -r simulation-core/requirements.txt -r tests/requirements-test.txt --short-report
      - run: python security/crypto.py
      - run: python security/audit.py
      - run: python security/anomaly.py
  deploy-staging:
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: docker compose -f infra/docker-compose.yml up -d
      - run: docker compose -f infra/docker-compose.yml ps
      - run: curl -f http://localhost:8000/health || exit 1
