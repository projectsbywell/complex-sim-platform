version: '3.9'
services:
  api:
    build: ../backend
    ports:
    - 8000:8000
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://sim:sim@postgres:5432/simdb
      REDIS_URL: redis://redis:6379
      SIMCORE_PATH: /app/simulation-core
    volumes:
    - ../simulation-core:/app/simulation-core:ro
    - ./data:/app/data
    depends_on:
    - postgres
    - mongo
    - redis
  frontend:
    image: nginx:alpine
    ports:
    - 5173:80
    volumes:
    - ../frontend:/usr/share/nginx/html:ro
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
      POSTGRES_DB: simdb
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sim
      interval: 10s
      timeout: 5s
      retries: 5
  mongo:
    image: mongo:7
    ports:
    - 27017:27017
    volumes:
    - mongodata:/data/db
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redisdata:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus
    ports:
    - 9090:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana
    ports:
    - 3000:3000
    depends_on:
    - prometheus
volumes:
  pgdata: {}
  mongodata: {}
  redisdata: {}
